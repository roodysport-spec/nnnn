workflows:
  customer-app-ios:
    name: Build Dukhan Customer (iOS Simulator)
    instance_type: mac_mini_m1
    environment:
      java: 21
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/assets --save-dev
      - name: Build Web Project
        script: |
          npm run build:customer
      - name: Generate App Assets
        script: |
          mkdir -p assets
          cp assets/app-icon.png assets/icon-only.png
          cp assets/app-icon.png assets/splash.png
          npx capacitor-assets generate --android
      - name: Capacitor Setup
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios || echo "Sync finished with potential Podfile warning, continuing..."
          if [ -f "GoogleService-Info.plist" ]; then
            cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist successfully copied to ios/App/App"
          else
            echo "Warning: GoogleService-Info.plist not found in root directory!"
          fi
      - name: Build iOS for Simulator
        script: |
          # Try building with .xcworkspace, if not found use .xcodeproj (SPM style)
          if [ -d "ios/App/App.xcworkspace" ]; then
            WORKSPACE_ARG="-workspace ios/App/App.xcworkspace"
          else
            WORKSPACE_ARG="-project ios/App/App.xcodeproj"
          fi
          
          xcodebuild $WORKSPACE_ARG \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            clean build
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app

  customer-app-android:
    name: Build Dukhan Customer (Android)
    instance_type: mac_mini_m1
    environment:
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/assets --save-dev
      - name: Build Web Project
        script: |
          npm run build:customer
      - name: Generate App Assets
        script: |
          mkdir -p assets
          cp assets/app-icon.png assets/icon-only.png
          cp assets/app-icon.png assets/splash.png
          npx capacitor-assets generate --android
      - name: Capacitor Setup
        script: |
          rm -rf android
          npx cap add android
          npx cap sync android
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json successfully copied to android/app"
          else
            echo "Warning: google-services.json not found in root directory!"
          fi
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

