<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>دخان — منيو المقهى</title>
  <meta name="description" content="تصفح قائمة المنتجات والعروض الحصرية لهذا المقهى">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .cafe-hero {
      height: 320px;
      position: relative;
      overflow: visible;
      background: var(--primary-dark);
      margin-bottom: 50px;
      transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: zoom-in;
    }
    .cafe-hero.expanded {
      height: 70vh;
      cursor: zoom-out;
    }
    .cafe-hero-img {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.8;
    }
    .cafe-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(28,10,4,0.9) 0%, rgba(28,10,4,0.4) 50%, transparent 100%);
      display: flex;
      align-items: flex-end;
      padding: 0 40px 60px;
    }
    .cafe-logo-lg {
      width: 120px; height: 120px;
      position: absolute;
      bottom: -60px; right: 40px;
      border-radius: 28px;
      border: 6px solid #1A1A1A;
      background: #1A1A1A;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      flex-shrink: 0;
      overflow: hidden;
      z-index: 20;
    }
    .cafe-header-info {
      color: #FFF;
      max-width: 600px;
    }
    .cafe-header-name { 
      font-size: 2.1rem; 
      font-weight: 950; 
      text-shadow: 0 2px 15px rgba(0,0,0,0.6); 
      margin-bottom: 4px;
    }
    .cafe-header-desc { 
      font-size: 0.9rem; 
      opacity: 0.9; 
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 12px;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .back-btn {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #FFF;
      padding: 10px 20px;
      border-radius: 50px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: var(--transition);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
    }
    .back-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
    
    /* Buttons Row - الأزرار أسفل الكوفر */
    .cafe-btns-row {
      position: absolute;
      bottom: -45px; left: 20px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 30;
      padding: 5px;
    }
    .nav-btn, .book-btn, .promo-btn {
      padding: 12px 20px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
      font-size: 0.88rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
    }
    .nav-btn { background: var(--accent); color: white; }
    .book-btn { background: #e74c3c; color: white; }
    .promo-btn { background: rgba(0,0,0,0.7); color: var(--accent); border: 1px solid rgba(212,163,115,0.3); }
    
    .nav-btn:hover, .book-btn:hover, .promo-btn:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
      filter: brightness(1.1);
    }

    @media (max-width: 600px) {
      .cafe-hero { height: 260px; margin-bottom: 100px; }
      .cafe-logo-lg { width: 90px; height: 90px; bottom: -45px; right: 15px; border-radius: 20px; }
      .cafe-hero-overlay { padding: 0 15px 55px; }
      .cafe-header-name { font-size: 1.6rem; }
      .cafe-btns-row { bottom: -90px; left: 0; right: 0; justify-content: center; gap: 8px; width: 100%; }
      .nav-btn, .book-btn, .promo-btn { padding: 8px 12px; font-size: 0.75rem; border-radius: 12px; }
      .back-btn { top: 15px; right: 15px; padding: 8px 14px; font-size: 0.85rem; }
    }
    
    .cafe-meta {
      display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px; font-size: 0.9rem; color: #FFF; opacity: 0.95;
    }
    .cafe-meta-item { display: flex; align-items: center; gap: 8px; }
    .cafe-meta a { color: var(--accent); text-decoration: none; font-weight: 800; border-bottom: 2px solid transparent; transition: 0.3s; }
    .cafe-meta a:hover { border-bottom-color: var(--accent); }
    
    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
    
    /* Category Tabs Customization */
    .cat-tabs { padding: 5px 0 15px; }
    .cat-tab { border-radius: 20px; padding: 15px 25px; transition: 0.4s; }
    .cat-tab.active { box-shadow: 0 8px 25px rgba(201, 168, 76, 0.3); }

    /* Feature Badges */
    .features-row {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 25px;
      padding: 0; background: none; justify-content: flex-start;
    }
    .feature-badge {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255, 255, 255, 0.05); 
      color: #E0C097; /* Clear Light Gold/Beige */
      padding: 4px 12px; border-radius: 8px; font-size: 0.72rem;
      border: 1px solid rgba(224, 192, 151, 0.3);
      transition: all 0.3s ease;
      font-weight: 700;
    }
    .feature-badge i { width: 12px; height: 12px; color: #E0C097; }
    .feature-badge:hover { 
      background: rgba(224, 192, 151, 0.15); 
      border-color: #E0C097;
      color: #FFF;
      transform: translateY(-2px);
    }

    /* Video Ad Overlay */
    .video-ad-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.96);
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.4s ease;
    }
    .video-ad-container { position: relative; width: 100%; height: 100%; max-width: 85vw; max-height: 85vh; display: flex; align-items: center; justify-content: center; }
    .video-ad-player { width: 100%; height: 100%; object-fit: contain; }
    .ad-badge {
      position: absolute; top: 20px; left: 20px; right: auto;
      background: rgba(212, 175, 55, 0.9); color: #000; padding: 4px 12px;
      border-radius: 4px; font-weight: 800; font-size: 0.75rem;
    }
  </style>
</head>
<body>

<!-- Video & Custom Ad Overlay -->
<div id="videoAdOverlay" class="video-ad-overlay" style="display:none;">
  <div class="video-ad-container" id="adContainerWrap" style="position:relative;">
    <!-- Ad Badge in the Top Left -->
    <div class="ad-badge" id="adLabelBadge" style="z-index:99;">إعلان ممول</div>
    
    <!-- Close Button (Top Right 'X') -->
    <button onclick="closeVideoAd()" style="position:absolute; top:20px; right:20px; z-index:99; background:rgba(0,0,0,0.6); color:#FFF; border:1px solid rgba(255,255,255,0.2); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(8px); transition:all 0.3s; font-size:1.1rem; font-weight:bold;" onmouseover="this.style.background='rgba(255,255,255,0.15)'; this.style.transform='scale(1.05)';" onmouseout="this.style.background='rgba(0,0,0,0.6)'; this.style.transform='scale(1)';">✕</button>

    <!-- Video Ad Player -->
    <video id="videoAdPlayer" class="video-ad-player" playsinline style="display:none; width:100%; height:100%; object-fit:contain;"></video>
    
    <!-- Image Ad Link & Player -->
    <a id="imageAdLink" href="javascript:void(0)" style="display:none; width:100%; height:100%; justify-content:center; align-items:center;">
      <img id="imageAdPlayer" style="max-width:100%; max-height:100%; object-fit:contain; border-radius:12px; filter:drop-shadow(0 10px 30px rgba(0,0,0,0.5));">
    </a>
    
    <!-- Playable Ad (Iframe) -->
    <iframe id="playableAdFrame" style="display:none; width:100%; height:100%; border:none; border-radius:12px; background:#000;"></iframe>
  </div>
</div>

<!-- Promo Video Overlay (فيديو المقهى التعريفي) -->
<div id="promoVideoOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center; animation: fadeIn 0.3s ease;">
  <div style="position:relative; width:100%; max-width:860px; max-height:90vh; display:flex; flex-direction:column;">
    <!-- Header -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:rgba(255,255,255,0.05); border-radius:16px 16px 0 0; border-bottom:1px solid rgba(255,255,255,0.1);">
      <div style="display:flex; align-items:center; gap:10px; color:#FFF;">
        <i data-lucide="play-circle" style="width:22px; color:var(--accent);"></i>
        <span style="font-weight:700; font-size:1rem;" id="promoVideoTitle">فيديو المقهى</span>
      </div>
      <button onclick="closePromoVideo()" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#FFF; width:36px; height:36px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.2rem; transition:0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">&#x2715;</button>
    </div>
    <!-- Video Player -->
    <video id="promoVideoPlayer" playsinline controls style="width:100%; max-height:75vh; object-fit:contain; background:#000; border-radius:0 0 16px 16px;"></video>
  </div>
</div>

<!-- Cafe Hero -->
<div class="cafe-hero" id="cafeHero">
  <div style="width:100%;height:100%;background:linear-gradient(135deg,var(--primary-dark),var(--primary));display:flex;align-items:center;justify-content:center;" id="heroDefault">
    <i data-lucide="image" style="width:80px; height:80px; color:rgba(255,255,255,0.1);"></i>
  </div>
  <div class="cafe-hero-overlay">
    <div class="cafe-header-info" class="cafe-hero-content">
      <div class="cafe-header-name" id="cafeName">جارٍ التحميل...</div>
      <div id="cafeDescContainer">
        <div class="cafe-header-desc" id="cafeDesc"></div>
      </div>
      <div class="cafe-meta" id="cafeMeta"></div>
    </div>
  </div>
  <div class="cafe-logo-lg" id="cafeLogo">
    <i data-lucide="coffee" style="width:40px; height:40px; color:var(--accent);"></i>
  </div>
  <a href="index.html" class="back-btn">
    <i data-lucide="arrow-right" style="width:18px; height:18px;"></i>
    رجوع
  </a>
  <!-- Cafe Buttons Row -->
  <div class="cafe-btns-row" id="cafeBtnsRow">
    <a href="#" id="navigateBtn" target="_blank" class="nav-btn" style="display:none;">
      <i data-lucide="navigation"></i>
      الذهاب للمقهى
    </a>
    <button id="bookBtn" class="book-btn" style="display:none;" onclick="openBookingModal()">
      <i data-lucide="calendar-plus"></i>
      حجز طاولة
    </button>
    <button id="promoVideoBtn" class="promo-btn" style="display:none;" onclick="openPromoVideo()">
      <i data-lucide="play-circle"></i>
      فيديو المكان
    </button>
  </div>
</div>

<!-- Booking Modal -->
<div class="modal-overlay" id="bookingModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">طلب حجز جديد</div>
      <button class="modal-close" onclick="closeBookingModal()">×</button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:20px; font-size:0.9rem; opacity:0.8;">سيصل طلب الحجز لصاحب المقهى وسيقوم بتأكيده عبر إرسال إشعار لك.</p>
      <form id="bookingForm">
        <div class="form-group">
          <label class="form-label">الاسم بالكامل</label>
          <input type="text" id="custName" class="form-control" placeholder="مثال: علي محمد" required lang="ar" inputmode="text" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الهاتف</label>
          <input type="tel" id="custPhone" class="form-control" placeholder="07XXXXXXXXX" required dir="ltr">
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeBookingModal()">إلغاء</button>
      <button class="btn btn-primary" id="confirmBookingBtn" onclick="submitBooking()">إرسال طلب الحجز</button>
    </div>
  </div>
</div>

<div class="page-wrap">
  <!-- Offers Carousel -->
  <div id="offersSection" style="display:none;">
    <div class="section-header">
      <h2 class="section-title"><i data-lucide="flame" style="color:var(--danger);"></i> عروض المقهى</h2>
    </div>
    <div class="offers-carousel" id="offersCarousel">
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-btn prev" onclick="moveCarousel(-1)"><i data-lucide="chevron-right"></i></button>
      <button class="carousel-btn next" onclick="moveCarousel(1)"><i data-lucide="chevron-left"></i></button>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
  </div>

  <!-- Categories Tabs -->
  <div id="menuSection">
    <!-- Features row will be injected here -->
    <div id="featuresContainer" style="margin: 0 15px 20px 15px;"></div>

    <div class="section-header" style="margin-bottom:15px;">
      <h2 class="section-title"><i data-lucide="book-open" style="color:var(--accent);"></i> قائمة المنتجات</h2>
    </div>
    <div class="loading" id="menuLoading">
      <div class="spinner"></div>
      <p>جارٍ تحميل المنيو الشهي...</p>
    </div>
    <div id="menuContent" style="display:none;">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="products-grid" id="productsGrid"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.9.0/jsrsasign-all-min.js"></script>
<script src="config.js"></script>
<script src="js/utils.js"></script>
<script src="js/cafe.js"></script>
</body>
</html>
