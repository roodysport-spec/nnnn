<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الإعلانات المرئية — دخان</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .video-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .video-card video { width: 100%; height: 180px; object-fit: cover; background: #000; display: block; }
    .video-card-body { padding: 16px; }
    .video-card-body h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: #1E272E; }
    .video-card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .upload-area {
      border: 2px dashed #E2E8F0;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      background: #FAFAFA;
    }
    .upload-area:hover { border-color: #D4AF37; background: #FFFDF5; }
    .upload-area input { display: none; }
    .upload-icon { font-size: 3rem; margin-bottom: 12px; }
    .progress-bar { height: 6px; background: #E2E8F0; border-radius: 100px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #D4AF37, #B8860B); border-radius: 100px; transition: width 0.3s; }
    .badge-active { background: #27AE60; color: #fff; padding: 3px 12px; border-radius: 50px; font-size: 0.78rem; font-weight: 700; }
    .badge-inactive { background: #E2E8F0; color: #718096; padding: 3px 12px; border-radius: 50px; font-size: 0.78rem; font-weight: 700; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <h1 style="font-size:2rem;">🎬 إعلانات دخان</h1>
      <p>دخول المدير فقط</p>
    </div>
    <div class="form-group">
      <label class="form-label">البريد الإلكتروني</label>
      <input type="email" id="email" class="form-control" dir="ltr">
    </div>
    <div class="form-group">
      <label class="form-label">كلمة المرور</label>
      <input type="password" id="password" class="form-control" dir="ltr">
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="doLogin()" id="loginBtn">دخول</button>
    <div style="text-align:center;margin-top:16px;">
      <a href="index.html" style="color:var(--text-mid);font-size:0.9rem;">العودة للرئيسية</a>
    </div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboardScreen" style="display:none; min-height:100vh; background:var(--bg);">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <a href="index.html" class="logo">دخان</a>
      <div style="display:flex;gap:12px;align-items:center;">
        <span style="color:rgba(255,255,255,0.6);font-size:0.9rem;">لوحة الإعلانات المرئية</span>
        <button class="btn btn-sm btn-outline" style="color:#fff;border-color:rgba(255,255,255,0.3);" onclick="doSignOut()">خروج</button>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:32px; padding-bottom:60px;">

    <!-- Stats -->
    <div class="stats-row" style="margin-bottom:30px;">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">إجمالي الإعلانات</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statActive">0</div>
        <div class="stat-label">الإعلانات النشطة</div>
      </div>
    </div>

    <!-- Upload New Video -->
    <div class="card" style="margin-bottom:30px;">
      <div class="card-body">
        <h2 class="section-title" style="margin-bottom:20px;">➕ رفع إعلان فيديو جديد</h2>

        <div class="form-group">
          <label class="form-label">عنوان الإعلان (اختياري)</label>
          <input type="text" id="newVideoTitle" class="form-control" placeholder="مثال: عرض رمضان الخاص">
        </div>

        <div class="form-group">
          <label class="form-label">ترتيب الظهور</label>
          <input type="number" id="newVideoOrder" class="form-control" value="0" min="0" style="max-width:120px;">
        </div>

        <label class="upload-area" id="uploadArea" onclick="document.getElementById('videoFileInput').click()">
          <div class="upload-icon">🎬</div>
          <div id="uploadLabel" style="font-weight:700;color:#1E272E;margin-bottom:8px;">اضغط هنا لاختيار فيديو</div>
          <div style="color:#718096;font-size:0.88rem;">MP4, MOV, WebM — حجم أقصى 50MB</div>
          <input type="file" id="videoFileInput" accept="video/mp4,video/mov,video/webm,video/*" onchange="onVideoSelected(this)">
          <div class="progress-bar" id="uploadProgressBar" style="display:none;max-width:400px;margin:14px auto 0;">
            <div class="progress-fill" id="uploadProgressFill" style="width:0%"></div>
          </div>
        </label>

        <div id="videoPreviewWrap" style="display:none;margin-top:16px;">
          <video id="videoPreview" controls style="width:100%;max-height:260px;border-radius:12px;background:#000;"></video>
        </div>

        <button class="btn btn-accent btn-lg" style="margin-top:20px;width:100%;" id="uploadBtn" onclick="uploadVideoAd()" disabled>
          رفع الإعلان
        </button>
      </div>
    </div>

    <!-- Video List -->
    <div class="section-header">
      <h2 class="section-title">📋 الإعلانات المرفوعة</h2>
      <button class="btn btn-outline btn-sm" onclick="loadVideoAds()">🔄 تحديث</button>
    </div>

    <div id="videoGrid" class="video-grid">
      <div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">
        <div class="spinner" style="margin:0 auto 16px;"></div>
        <p>جاري التحميل...</p>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">تعديل الإعلان</div>
      <button class="modal-close" onclick="closeEditModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label class="form-label">العنوان</label>
        <input type="text" id="editTitle" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">ترتيب الظهور</label>
        <input type="number" id="editOrder" class="form-control" min="0" style="max-width:120px;">
      </div>
      <div class="form-group" style="margin-top:10px;">
        <label style="display:flex;align-items:center;gap:12px;cursor:pointer;">
          <label class="toggle">
            <input type="checkbox" id="editActive">
            <span class="toggle-slider"></span>
          </label>
          <span style="font-weight:600;">الإعلان نشط (يظهر للزبائن)</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeEditModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveEdit()">حفظ</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  let currentUser = null;
  let selectedFile = null;

  // ==========================================
  // Auth
  // ==========================================
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
      if (profile?.role !== 'admin') {
        showToast('هذه الصفحة للمدير فقط', 'error');
        setTimeout(() => window.location.replace('index.html'), 1500);
        return;
      }
      currentUser = session.user;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboardScreen').style.display = 'block';
      loadVideoAds();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('dashboardScreen').style.display = 'none';
    }
  });

  async function doLogin() {
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الدخول...';
    try {
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      if (error) throw error;
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'دخول';
    }
  }

  async function doSignOut() {
    await sb.auth.signOut();
    window.location.replace('index.html');
  }

  // ==========================================
  // Load Video Ads
  // ==========================================
  async function loadVideoAds() {
    const grid = document.getElementById('videoGrid');
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;"><div class="spinner" style="margin:0 auto 16px;"></div><p>جاري التحميل...</p></div>`;

    try {
      const { data, error } = await sb.from('video_ads').select('*').order('order_index');
      if (error) throw error;

      const total = data.length;
      const active = data.filter(v => v.is_active).length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statActive').textContent = active;

      if (!data.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">لا توجد إعلانات مرفوعة بعد</div>`;
        return;
      }

      grid.innerHTML = data.map(v => `
        <div class="video-card">
          <video src="${v.video_url}" controls preload="metadata" style="width:100%;height:180px;object-fit:cover;background:#000;display:block;"
            ${v.thumbnail_url ? `poster="${v.thumbnail_url}"` : ''}></video>
          <div class="video-card-body">
            <h3>${v.title || 'بدون عنوان'}</h3>
            <div style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:#718096;margin-bottom:4px;">
              <span>ترتيب: ${v.order_index}</span>
              <span>|</span>
              <span class="${v.is_active ? 'badge-active' : 'badge-inactive'}">${v.is_active ? 'نشط' : 'معطل'}</span>
            </div>
            <div style="font-size:0.75rem;color:#aaa;" dir="ltr">${new Date(v.created_at).toLocaleDateString('ar-IQ')}</div>
            <div class="video-card-actions">
              <button class="btn btn-outline btn-sm" style="flex:1;" onclick='openEdit(${JSON.stringify(v).replace(/'/g,"&#39;")})'>✏️ تعديل</button>
              <button class="btn btn-danger btn-sm" style="flex:1;" onclick="deleteVideo('${v.id}', '${v.video_url}')">🗑️ حذف</button>
            </div>
          </div>
        </div>`).join('');
    } catch (err) {
      showToast('خطأ في التحميل: ' + err.message, 'error');
    }
  }

  // ==========================================
  // Upload
  // ==========================================
  function onVideoSelected(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
      showToast('حجم الفيديو أكبر من 50MB', 'error');
      return;
    }
    selectedFile = file;
    const url = URL.createObjectURL(file);
    const preview = document.getElementById('videoPreview');
    preview.src = url;
    document.getElementById('videoPreviewWrap').style.display = 'block';
    document.getElementById('uploadLabel').textContent = '✅ ' + file.name;
    document.getElementById('uploadBtn').disabled = false;
  }

  async function uploadVideoAd() {
    if (!selectedFile) { showToast('اختر فيديو أولاً', 'error'); return; }

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الرفع...';

    const progressBar = document.getElementById('uploadProgressBar');
    const progressFill = document.getElementById('uploadProgressFill');
    progressBar.style.display = 'block';

    try {
      const ext = selectedFile.name.split('.').pop();
      const fileName = `videos/${Date.now()}_${Math.random().toString(36).substr(2,8)}.${ext}`;

      // رفع تدريجي مع تتبع التقدم
      const { data: uploadData, error: uploadError } = await sb.storage
        .from(STORAGE_BUCKET)
        .upload(fileName, selectedFile, {
          cacheControl: '3600',
          upsert: false,
          onUploadProgress: (e) => {
            const pct = Math.round((e.loaded / e.total) * 100);
            progressFill.style.width = pct + '%';
          }
        });

      if (uploadError) throw uploadError;

      const { data: urlData } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
      const videoUrl = urlData.publicUrl;

      const { error: insertError } = await sb.from('video_ads').insert([{
        title: document.getElementById('newVideoTitle').value.trim() || null,
        video_url: videoUrl,
        order_index: parseInt(document.getElementById('newVideoOrder').value) || 0,
        is_active: true
      }]);

      if (insertError) throw insertError;

      showToast('تم رفع الإعلان بنجاح! ✅', 'success');
      selectedFile = null;
      document.getElementById('newVideoTitle').value = '';
      document.getElementById('newVideoOrder').value = '0';
      document.getElementById('videoPreviewWrap').style.display = 'none';
      document.getElementById('uploadLabel').textContent = 'اضغط هنا لاختيار فيديو';
      document.getElementById('videoFileInput').value = '';
      progressFill.style.width = '0%';
      progressBar.style.display = 'none';
      loadVideoAds();
    } catch (err) {
      showToast('فشل الرفع: ' + err.message, 'error');
      progressBar.style.display = 'none';
    } finally {
      btn.disabled = false; btn.textContent = 'رفع الإعلان';
    }
  }

  // ==========================================
  // Edit & Delete
  // ==========================================
  function openEdit(v) {
    document.getElementById('editId').value = v.id;
    document.getElementById('editTitle').value = v.title || '';
    document.getElementById('editOrder').value = v.order_index || 0;
    document.getElementById('editActive').checked = v.is_active;
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

  async function saveEdit() {
    const id = document.getElementById('editId').value;
    try {
      const { error } = await sb.from('video_ads').update({
        title: document.getElementById('editTitle').value.trim() || null,
        order_index: parseInt(document.getElementById('editOrder').value) || 0,
        is_active: document.getElementById('editActive').checked
      }).eq('id', id);
      if (error) throw error;
      showToast('تم الحفظ ✅', 'success');
      closeEditModal();
      loadVideoAds();
    } catch (err) {
      showToast('خطأ: ' + err.message, 'error');
    }
  }

  async function deleteVideo(id, videoUrl) {
    if (!confirm('هل أنت متأكد من حذف هذا الإعلان نهائياً؟')) return;
    try {
      // حذف الملف من Storage
      const path = videoUrl.split('/' + STORAGE_BUCKET + '/')[1];
      if (path) await sb.storage.from(STORAGE_BUCKET).remove([path]);
      // حذف السجل من قاعدة البيانات
      const { error } = await sb.from('video_ads').delete().eq('id', id);
      if (error) throw error;
      showToast('تم الحذف', 'success');
      loadVideoAds();
    } catch (err) {
      showToast('خطأ في الحذف: ' + err.message, 'error');
    }
  }

  // ==========================================
  // Toast
  // ==========================================
  function showToast(msg, type = 'info') {
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
    document.getElementById('toastContainer').prepend(el);
    setTimeout(() => el.remove(), 3500);
  }
</script>
</body>
</html>
